name: Carousel Windows CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "appimage/**"
      - "flatpak/**"

jobs:
  run-ci:
    permissions:
      contents: read
    uses: ./.github/workflows/carousel-windows.yml
